name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Verify web build output
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "=== dist/ size ==="
          du -sh dist/

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Verify sync output
        run: |
          echo "=== android/app/src/main/assets/ ==="
          ls -laR android/app/src/main/assets/ || echo "assets dir missing"
          echo "=== capacitor-cordova-android-plugins ==="
          ls -la android/capacitor-cordova-android-plugins/ || echo "cordova plugins dir missing"
          echo "=== capacitor.settings.gradle ==="
          cat android/capacitor.settings.gradle

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          set -e
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-output.log
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Print Gradle error log on failure
        if: failure()
        run: |
          echo "==================== GRADLE ERROR LOG (FULL) ===================="
          cat android/gradle-output.log || true
          echo "=================================================================="
          echo "## Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 android/gradle-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: List build outputs
        if: always()
        run: |
          echo "=== Searching for all APK files ==="
          find . -name "*.apk" -ls || true
          echo "=== android/app/build/outputs structure ==="
          ls -laR android/app/build/outputs/ || true

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-output.log
          retention-days: 7

      - name: Create Failure Release with Log
        if: failure() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: android/gradle-output.log
          tag_name: build-failure-v${{ github.run_number }}
          name: "Build Failure Log v${{ github.run_number }}"
          body_path: android/gradle-output.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-debug
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release with APK
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          tag_name: v${{ github.run_number }}
          name: "DeepFocus v${{ github.run_number }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}